name: docker

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    # default: CUDA 12.8 (RTX 20xx up to RTX 50xx); pascal: CUDA 12.6 (also GTX 10xx, not for RTX 50xx)
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            cuda: cu128
            suffix: ''
          - variant: pascal
            cuda: cu126
            suffix: '-pascal'
    runs-on: ubuntu-latest
    steps:
      # the cuda torch stack is several gb; the stock runner runs out of disk without this
      - name: free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch && matrix.variant == 'default' }}
            type=raw,value=pascal,enable=${{ github.ref_name == github.event.repository.default_branch && matrix.variant == 'pascal' }}
            type=ref,event=branch,suffix=${{ matrix.suffix }},enable=${{ github.ref_name != github.event.repository.default_branch }}
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=sha,suffix=${{ matrix.suffix }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            TORCH_CUDA=${{ matrix.cuda }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache${{ matrix.suffix }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache${{ matrix.suffix }},mode=max
